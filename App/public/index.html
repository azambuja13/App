    <script>
        // Error Boundary global - evita que um erro de render em QUALQUER aba
        // derrube o app inteiro (tela travada/branca sem nenhum log).
        // Em vez disso mostra uma tela de recuperação com "Tentar novamente".
        class GlobalErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            componentDidCatch(error, info) {
                // error (objeto Error) não serializa direito nesse console bridge (vira "{}"),
                // então logamos message/stack como string pra dar pra debugar de verdade.
                console.error('🧯 [GlobalErrorBoundary] Erro capturado:', (error && (error.message || String(error))) || 'erro desconhecido');
                if (error && error.stack) console.error('🧯 [GlobalErrorBoundary] Stack:', error.stack);
                if (info && info.componentStack) console.error('🧯 [GlobalErrorBoundary] Component stack:', info.componentStack);
            }
            render() {
                if (this.state.hasError) {
                    return React.createElement('div', {
                        style: {
                            position: 'fixed', inset: 0, display: 'flex', flexDirection: 'column',
                            alignItems: 'center', justifyContent: 'center', padding: '24px',
                            background: '#ffffff', zIndex: 999999, textAlign: 'center',
                            fontFamily: '-apple-system, system-ui, sans-serif'
                        }
                    },
                        React.createElement('div', { style: { fontSize: '48px', marginBottom: '12px' } }, '⚠️'),
                        React.createElement('h2', { style: { fontSize: '18px', fontWeight: 'bold', marginBottom: '8px', color: '#1f2937' } }, 'Ops, algo deu errado nesta tela'),
                        React.createElement('p', { style: { fontSize: '14px', color: '#6b7280', marginBottom: '20px', maxWidth: '320px' } }, 'Seus dados estão salvos. Toque abaixo para tentar novamente.'),
                        React.createElement('div', { style: { display: 'flex', gap: '10px' } },
                            React.createElement('button', {
                                onClick: () => this.setState({ hasError: false }),
                                style: { padding: '12px 20px', borderRadius: '8px', background: '#ea580c', color: '#fff', fontWeight: '600', border: 'none', fontSize: '15px' }
                            }, 'Tentar novamente'),
                            React.createElement('button', {
                                onClick: () => window.location.reload(),
                                style: { padding: '12px 20px', borderRadius: '8px', background: '#374151', color: '#fff', fontWeight: '600', border: 'none', fontSize: '15px' }
                            }, 'Recarregar app')
                        )
                    );
                }
                return this.props.children;
            }
        }

        // Função para renderizar o app
        function renderApp() {
            console.log('🚀 Tentando renderizar AppFull...');

            if (window.AppFull && window.ReactDOM && window.PlanProvider && document.getElementById('root')) {
                console.log('✅ Todos os componentes disponíveis, renderizando...');
                const root = ReactDOM.createRoot(document.getElementById('root'));
                // Envolver AppFull com PlanProvider para contexto funcionar,
                // e tudo dentro do GlobalErrorBoundary para nunca travar o app inteiro.
                root.render(
                    React.createElement(GlobalErrorBoundary, null,
                        React.createElement(window.PlanProvider, null,
                            React.createElement(window.AppFull)
                        )
                    )
                );
                console.log('✅ AppFull renderizado com sucesso com PlanProvider!');
            } else {
                console.log('⏳ Aguardando componentes...', {
                    AppFull: !!window.AppFull,
                    ReactDOM: !!window.ReactDOM,
                    PlanProvider: !!window.PlanProvider,
                    rootElement: !!document.getElementById('root')
                });
                setTimeout(renderApp, 100);
            }
        }

        // Iniciar renderização
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderApp);
        } else {
            renderApp();
        }
    </script>

        // Função para normalizar todas as categorias de ingredientes
        window.normalizarCategorias = async function() {
            console.log('🔄 Normalizando categorias de todos os ingredientes...');

            try {
                if (!window.eventState) {
                    console.error('❌ eventState não encontrado');
                    return;
                }

                // Descobrir onde os ingredientes estão armazenados
                let ingredients = null;
                let setIngredients = null;

                // Tentar diferentes possíveis localizações
                if (window.eventState.ingredients) {
                    ingredients = window.eventState.ingredients;
                    setIngredients = window.eventState.setIngredients;
                } else if (window.eventState.eventData && window.eventState.eventData.ingredients) {
                    ingredients = window.eventState.eventData.ingredients;
                    setIngredients = (newIngredients) => {
                        window.eventState.setEventData({
                            ...window.eventState.eventData,
                            ingredients: newIngredients
                        });
                    };
                } else {
                    // Tentar encontrar automaticamente procurando por arrays
                    console.log('🔍 Procurando ingredientes no eventState...');
                    for (const key of Object.keys(window.eventState)) {
                        const value = window.eventState[key];
                        if (Array.isArray(value) && value.length > 0 && value[0].name && value[0].category) {
                            console.log(`✅ Encontrado em: eventState.${key}`);
                            ingredients = value;
                            const setterName = 'set' + key.charAt(0).toUpperCase() + key.slice(1);
                            setIngredients = window.eventState[setterName];
                            break;
                        }
                    }
                }

                if (!ingredients || ingredients.length === 0) {
                    console.error('❌ Ingredientes não encontrados no eventState');
                    console.log('💡 Execute: Object.keys(window.eventState) para ver propriedades disponíveis');
                    return;
                }

                console.log(`📊 Total de ingredientes: ${ingredients.length}`);

                // Importar função de normalização
                if (!window.normalizeCategory) {
                    console.error('❌ normalizeCategory não encontrada. Aguarde o carregamento completo da página.');
                    return;
                }

                let changed = 0;
                const normalized = ingredients.map(ing => {
                    const oldCategory = ing.category;
                    const newCategory = window.normalizeCategory(oldCategory);

                    if (oldCategory !== newCategory) {
                        console.log(`  🔄 "${ing.name}": "${oldCategory}" → "${newCategory}"`);
                        changed++;
                    }

                    return {
                        ...ing,
                        category: newCategory
                    };
                });

                if (changed === 0) {
                    console.log('✅ Todas as categorias já estão normalizadas!');
                    return;
                }

                console.log(`\n📊 Resumo: ${changed} ingredientes serão atualizados`);

                const confirm = window.confirm(`Deseja normalizar ${changed} categoria(s)?\n\nIsso vai atualizar as categorias para os valores padrão.`);

                if (!confirm) {
                    console.log('❌ Operação cancelada');
                    return;
                }

                // Atualizar no estado
                if (setIngredients) {
                    setIngredients(normalized);
                    console.log('✅ Categorias normalizadas com sucesso!');
                    console.log('💾 Salvando automaticamente...');
                } else {
                    console.error('❌ Função setter não encontrada para atualizar ingredientes');
                }

            } catch (error) {
                console.error('❌ Erro ao normalizar categorias:', error);
            }
        };

        // ✅ Recalcular stats de todos os cardápios salvos (incluindo totalPrice)
        window.recalcularCardapios = async function() {
            console.log('🔄 Recalculando stats de todos os cardápios...');
            console.log('🔄 Forçando reload do SavedMenusManager atualizado...');

            try {
                // Força reload do módulo com timestamp para evitar cache
                const timestamp = Date.now();
                const savedMenusModule = await import(`./core/SavedMenusManager.js?v=${timestamp}`);
                const manager = savedMenusModule.savedMenusManager;

                if (!manager) {
                    console.error('❌ SavedMenusManager não disponível');
                    return;
                }

                const menus = await manager.getAll();
                console.log(`📋 Encontrados ${menus.length} cardápios`);

                for (const menu of menus) {
                    if (menu.dishes && menu.dishes.length > 0) {
                        // Recalcular stats com o módulo atualizado
                        const newStats = manager.calculateMenuStats(menu.dishes);
                        menu.stats = newStats;

                        // Salvar
                        await manager.saveItem(menu);

                        console.log(`✅ ${menu.name}:`, {
                            custo: newStats.totalCost.toFixed(2),
                            precoComMargem: newStats.totalPrice ? newStats.totalPrice.toFixed(2) : 'N/A',
                            temMargem: newStats.totalPrice > newStats.totalCost
                        });
                    }
                }

                console.log('✅ Todos os cardápios foram recalculados!');
            } catch (error) {
                console.error('❌ Erro ao recalcular:', error);
            }
        };

        // ✅ Verificar margem no cardápio ativo
        window.verificarMargemCardapio = async function() {
            console.log('🔍 Verificando margem no cardápio ativo...');

            const stats = await window.menuManager.getStatistics();
            console.log('📊 Estatísticas do cardápio:', {
                totalCost: stats.totalCost?.toFixed(2),
                totalPrice: stats.totalPrice?.toFixed(2),
                hasMargin: stats.totalPrice > stats.totalCost,
                marginPercent: stats.totalPrice > stats.totalCost
                    ? (((stats.totalPrice - stats.totalCost) / stats.totalCost) * 100).toFixed(1) + '%'
                    : 'Sem margem'
            });

            const menu = await window.menuManager.getActiveMenu();
            console.log('🍽️ Pratos com margem:', menu.map(item => ({
                name: item.dishName,
                cost: item.dishCost?.toFixed(2),
                profitMargin: item.profitMargin + '%',
                suggestedPrice: item.suggestedPrice || 'N/A',
                hasMargin: (item.profitMargin > 0) || (item.suggestedPrice > 0)
            })));
